name: Nightly backup

# Saves an encrypted copy of all wedding planner data every night, kept for 90 days.
# Needs three repository secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and BACKUP_PASSPHRASE.
# Until they are added, the run is skipped. See "Nightly backup" in the README.

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        id: check
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::Backup skipped: add SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and BACKUP_PASSPHRASE as repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20
      - name: Export from Supabase
        if: steps.check.outputs.ready == 'true'
        run: node scripts/backup.mjs
      - name: Compress and encrypt
        if: steps.check.outputs.ready == 'true'
        run: |
          gzip -9 backup.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in backup.json.gz -out "wedding-backup-$(date -u +%F).json.gz.enc" -pass env:BACKUP_PASSPHRASE
          rm backup.json.gz
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: wedding-backup-${{ github.run_id }}
          path: wedding-backup-*.json.gz.enc
          retention-days: 90
